<!DOCTYPE html>
<html>
<head>
    <title>My Landing Page</title>
</head>
<body>

    <h1>My Awesome Landing Page</h1>
    <p>Download this page and see the form work!</p>

    <!-- This is the form we will modify -->
    <form id="contact-form">
        <!-- A hidden field for spam protection (optional but good practice) -->
        <p style="display:none;">
            <label>Don’t fill this out if you’re human: <input name="bot-field"></label>
        </p>

        <p>
            <label>Your Name: <input type="text" name="name" required></label>
        </p>
        <p>
            <label>Your Email: <input type="email" name="email" required></label>
        </p>
        <p>
            <label>Message: <textarea name="message" required></textarea></label>
        </p>
        <p>
            <button type="submit">Send</button>
        </p>
    </form>

    <!-- To display success or error messages -->
    <div id="form-status"></div>

    <script>
        const contactForm = document.getElementById('contact-form');
        const formStatus = document.getElementById('form-status');

        contactForm.addEventListener('submit', event => {
            event.preventDefault(); // Prevent the default form submission

            const formData = new FormData(contactForm);
            const data = Object.fromEntries(formData.entries());

            // Simple bot check
            if (data['bot-field']) {
                return;
            }
            delete data['bot-field']; // Remove it from the data we send

            formStatus.innerHTML = 'Sending...';

            // The endpoint for our Netlify Function
            const endpoint = '/.netlify/functions/submit-form';

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => response.json())
            .then(result => {
                contactForm.reset(); // Clear the form
                formStatus.innerHTML = `<p style="color: green;">${result.message}</p>`;
                console.log('Success:', result);
            })
            .catch(error => {
                formStatus.innerHTML = `<p style="color: red;">There was an error. Please try again.</p>`;
                console.error('Error:', error);
            });
        });
    </script>

</body>
</html>

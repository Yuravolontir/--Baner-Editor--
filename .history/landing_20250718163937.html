<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/banner.css">
    <script type="module" src="/scripts/landing.js"></script>
    <!--Google Fonts-->
 <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro&family=DM+Sans&family=Figtree&family=Inter&family=Manrope&family=Outfit&family=Rubik&family=Space+Grotesk&family=Sora&family=Urbanist&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Orbitron:wght@400..900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <nav>
    <ul>
    <li><a href="/dashboard.html">Home</a></li>
    <li><a href="/banner.html">Banner Editor</a></li>
    <li><a href="/email.html">Marketing Page Editor (for Email)</a></li>
    <li><a href="/landing.html">Landing Page Editor</a></li>
    </ul>
</nav>


<div id="banner-builder-container">
<div id="controls-section">

<label>Select Template:</label>
<select id="templates">
  <option value="default">Empty</option>
  <option value="template1">1</option>
  <option value="template2">2</option>
  <option value="template3">3</option>
</select>

<h3>Text</h3>
<label for="Heading">Heading:</label>
<textarea id="Heading" placeholder="Enter your heading text here..."></textarea>
<button id="emojiHeading">😀</button>

<label for="Text">Main Text:</label>
<textarea id="Text" placeholder="Enter your main text here..."></textarea>
<button id="emojiText">😀</button>

<h3>Background Color</h3>
<input type="color" id="BackgroundColor">

<h3>Heading Color</h3>
<input type="color" id="HeadingColor">

<h3>Text Color</h3>
<input type="color" id="TextColor">

<h3>CTA Button Text</h3>
<input type="text" id="CTAButtonText" placeholder="Enter CTA button text">

<h3>CTA Button Behavior</h3>
<select id="CTAButtonBehavior">
  <option value="default">📎 Link to URL</option>
  <option value="Behavior1">📞 Phone</option>
  <option value="template2">💬 Whatsapp</option>
</select>

<h3>Choose heading font</h3>
<select id="head-font">
  <option value="Courier New">Courier New</option>
  <option value="Inter">Inter</option>
  <option value="Poppins">Poppins</option>
  <option value="Space Grotesk">Space Grotesk</option>
  <option value="Outfit">Outfit</option>
  <option value="Manrope">Manrope</option>
  <option value="Sora">Sora</option>
  <option value="Figtree">Figtree</option>
  <option value="Rubik">Rubik</option>
  <option value="Urbanist">Urbanist</option>
  <option value="DM Sans">DM Sans</option>
  <option value="Silkscreen, sans-serif">Silkscreen Static</option>
  <option value="Orbitron, sans-serif">Orbitron</option>
  <option value="Lobster Two, sans-serif">Lobster Two</option>
  <option value="Bangers, system-ui">Bangers</option>
</select>

<h3>Choose text font</h3>
<select id="text-font">
  <option value="Courier New">Courier New</option>
  <option value="Inter">Inter</option>
  <option value="Poppins">Poppins</option>
  <option value="Space Grotesk">Space Grotesk</option>
  <option value="Outfit">Outfit</option>
  <option value="Manrope">Manrope</option>
  <option value="Sora">Sora</option>
  <option value="Figtree">Figtree</option>
  <option value="Rubik">Rubik</option>
  <option value="Urbanist">Urbanist</option>
  <option value="DM Sans">DM Sans</option>
  <option value="Silkscreen, sans-serif">Silkscreen Static</option>
  <option value="Orbitron, sans-serif">Orbitron</option>
  <option value="Lobster Two, sans-serif">Lobster Two</option>
  <option value="Bangers, system-ui">Bangers</option>
</select>

<h3>Banner Heading Font-size</h3>
<input type="number" id="headingFontSize" placeholder="Enter font size in px" value="24">

<h3>Banner Text Font-size</h3>
<input type="number" id="textFontSize" placeholder="Enter font size in px" value="16">

<label>Add img (enter URL:)</label>
<input type="text" id="addimageInput" placeholder="Enter image URL" />

<label>Set img background URL:</label>
<input type="text" id="imageInput" placeholder="Enter image URL" />

<h3>Try our gradient</h3>
<select id="designStyle">
  <option value="default">Empty</option>
  <option value="gradient1">Minimal Clean</option>
  <option value="gradient2">Bold & Colorful</option>
  <option value="gradient3">Retro Pixel</option>
</select>


</div>

<div id="preview">
    
</div>

<button id="DownloadHTML">Download HTML file</button>
<button id="saveLanding">Save</button>

</div>









</body>
</html>

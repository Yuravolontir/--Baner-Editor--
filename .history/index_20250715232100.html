<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/styles.css">
    <script type="module" src="/scripts/index.js"></script>

</head>
<body>

  <div id="forms-wrapper">
    <div id="form-container">
        <h1>Please Register</h1>
    <form  action="/dashboard.html" >
        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname" required><br><br>
    
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>
    
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>
    
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required pattern=".{6,}" title="Password must be at least 6 characters long"><br><br>
    
        <label for="confirm_password">Confirm Password:</label><br>
        <input type="password" id="confirm_password" name="confirm_password" required pattern=".{6,}" title="Please enter the same password again" oninput="this.setCustomValidity(this.value != document.getElementById('password').value ? 'Passwords do not match.' : '')"><br><br>
        <button type="submit">Submit</button>
    </form>
</div>

<div id="form-login-container">
    <h1>Or Login</h1>
    <form action="/dashboard.html" >
        <label for="login-username">Username:</label><br>
        <input type="text" id="login-username" name="login-username" required><br><br>
    
        <label for="login-password">Password:</label><br>
        <input type="password" id="login-password" name="login-password" required><br><br>
    
        <button type="submit">Login</button>
    </form>
</div>
  </div>
</body>
</html>

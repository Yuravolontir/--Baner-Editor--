<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing Page Editor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
    }
    .editor, .preview {
      flex: 1;
    }
    .preview {
      border: 2px solid #ddd;
      padding: 20px;
    }
    .template {
      border: 1px dashed #999;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    input, textarea, select {
      display: block;
      margin-bottom: 10px;
      width: 100%;
      padding: 5px;
    }
    button {
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="editor">
  <h2>Editor</h2>
  
  <label>Select Template:</label>
  <div id="templates">
    <div class="template" data-template="1">Template 1</div>
    <div class="template" data-template="2">Template 2</div>
    <div class="template" data-template="3">Template 3</div>
  </div>

  <label>Headline:</label>
  <input id="headlineInput" type="text" placeholder="Enter headline" />

  <label>Paragraph:</label>
  <textarea id="paragraphInput" placeholder="Enter paragraph"></textarea>

  <label>Image URL:</label>
  <input id="imageInput" type="text" placeholder="Enter image URL" />

  <label>CTA Button Text:</label>
  <input id="ctaInput" type="text" placeholder="Call to Action" />

  <label>Background Color:</label>
  <input id="bgColor" type="color" />

  <label>Text Color:</label>
  <input id="textColor" type="color" />

  <label>Font Family:</label>
  <select id="fontSelect">
    <option value="Arial">Arial</option>
    <option value="Georgia">Georgia</option>
    <option value="Courier New">Courier New</option>
    <option value="Tahoma">Tahoma</option>
  </select>

  <h3>Lead Form</h3>
  <label>Show Lead Form?</label>
  <select id="leadFormToggle">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <button onclick="saveToLocal()">💾 Save</button>
</div>

<div class="preview" id="preview">
  <!-- Preview will update live here -->
</div>

<script>
  const preview = document.getElementById('preview');

  const inputs = {
    headline: document.getElementById('headlineInput'),
    paragraph: document.getElementById('paragraphInput'),
    image: document.getElementById('imageInput'),
    cta: document.getElementById('ctaInput'),
    bgColor: document.getElementById('bgColor'),
    textColor: document.getElementById('textColor'),
    font: document.getElementById('fontSelect'),
    leadForm: document.getElementById('leadFormToggle')
  };

  let selectedTemplate = 1;

  document.querySelectorAll(".template").forEach(t => {
    t.addEventListener("click", () => {
      selectedTemplate = parseInt(t.dataset.template);
      updatePreview();
    });
  });

  Object.values(inputs).forEach(input => {
    input.addEventListener('input', updatePreview);
  });

  function updatePreview() {
    preview.innerHTML = "";

    const container = document.createElement("div");
    container.style.background = inputs.bgColor.value;
    container.style.color = inputs.textColor.value;
    container.style.fontFamily = inputs.font.value;
    container.style.padding = "20px";

    const h1 = document.createElement("h1");
    h1.textContent = inputs.headline.value;
    container.appendChild(h1);

    const p = document.createElement("p");
    p.textContent = inputs.paragraph.value;
    container.appendChild(p);

    if (inputs.image.value) {
      const img = document.createElement("img");
      img.src = inputs.image.value;
      img.style.maxWidth = "100%";
      container.appendChild(img);
    }

    const cta = document.createElement("button");
    cta.textContent = inputs.cta.value || "Click Me";
    container.appendChild(cta);

    if (inputs.leadForm.value === "yes") {
      const form = document.createElement("form");
      form.innerHTML = `
        <h3>Join Us</h3>
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
        <button type="submit">Submit</button>
      `;
      container.appendChild(form);
    }

    preview.appendChild(container);
  }

  function saveToLocal() {
    const data = {
      template: selectedTemplate,
      headline: inputs.headline.value,
      paragraph: inputs.paragraph.value,
      image: inputs.image.value,
      cta: inputs.cta.value,
      bgColor: inputs.bgColor.value,
      textColor: inputs.textColor.value,
      font: inputs.font.value,
      leadForm: inputs.leadForm.value
    };
    localStorage.setItem("landingPageData", JSON.stringify(data));
    alert("Page saved!");
  }

  function loadFromLocal() {
    const data = JSON.parse(localStorage.getItem("landingPageData"));
    if (!data) return;

    selectedTemplate = data.template || 1;
    inputs.headline.value = data.headline || "";
    inputs.paragraph.value = data.paragraph || "";
    inputs.image.value = data.image || "";
    inputs.cta.value = data.cta || "";
    inputs.bgColor.value = data.bgColor || "#ffffff";
    inputs.textColor.value = data.textColor || "#000000";
    inputs.font.value = data.font || "Arial";
    inputs.leadForm.value = data.leadForm || "yes";

    updatePreview();
  }

  window.addEventListener("DOMContentLoaded", loadFromLocal);
</script>

</body>
</html>
